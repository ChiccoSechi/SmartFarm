# Mosquitto config: without it the image listens only on localhost and rejects anonymous clients.

# Listener on all interfaces: reachable by the name "mosquitto".
listener 1883

allow_anonymous true

# On-disk persistence: sessions and queues survive restarts.
persistence true
persistence_location /mosquitto/data/

# Wide in-flight window: with the default (20) and ACKs on every flush, throughput stalled around 10 msg/s, below the 16 generated.
max_inflight_messages 1000
# Large queue for an offline Telegraf: a long restart of it does not drop messages.
max_queued_messages 1000000
