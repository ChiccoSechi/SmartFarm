# Broker to DB bridge: 4 MQTT inputs, basicstats, InfluxDB (raw) + MongoDB (aggregates).
# The json_v2 paths match the producer keys.

[agent]
  interval = "10s"             # input pull cadence (MQTT is push, so this matters little)
  # flush at 2s: with QoS 1 the ACKs happen only on flush, a slow one throttles throughput
  flush_interval = "2s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000  # about 7 min of buffered data if an output is down
  omit_hostname = true         # no "host" tag: not useful here


# One input block per sensor type (different schemas mean different measurements);
# qos=1 + persistent_session recover messages lost across restarts.

# 1) air: farm/{zone}/air_quality
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["farm/+/air_quality"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-air"               # unique per block
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "air_quality"
    timestamp_path = "timestamp"
    timestamp_format = "rfc3339"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["zone", "sensor_id"]         # tags are identity, the rest are fields
      excluded_keys = ["type", "timestamp"]

# 2) soil: farm/{zone}/soil_quality
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["farm/+/soil_quality"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-soilq"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "soil_quality"
    timestamp_path = "timestamp"
    timestamp_format = "rfc3339"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["zone", "sensor_id"]
      excluded_keys = ["type", "timestamp"]

# 3) moisture: farm/{zone}/soil_moisture
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["farm/+/soil_moisture"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-soilm"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "soil_moisture"
    timestamp_path = "timestamp"
    timestamp_format = "rfc3339"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      tags = ["zone", "sensor_id"]
      excluded_keys = ["type", "timestamp"]

# 4) power: farm/actuators/{actuator_id}
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["farm/actuators/+"]
  qos = 1
  persistent_session = true
  client_id = "telegraf-power"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "power_consumption"
    timestamp_path = "timestamp"
    timestamp_format = "rfc3339"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "@this"
      # "status" is a tag: used to filter the power alert and to color Grafana
      tags = ["actuator_id", "actuator_type", "zone", "status", "sensor_id"]
      excluded_keys = ["type", "timestamp"]


# Aggregator: marks aggregates with aggregated=true and _hourly (outputs split on that tag);
# period 5m instead of 1h just for the demo.
[[aggregators.basicstats]]
  period = "5m"
  drop_original = false
  stats = ["mean", "min", "max", "count"]
  name_suffix = "_hourly"
  [aggregators.basicstats.tags]
    aggregated = "true"


# Output 1, InfluxDB: raw data only (realtime); url/token/org/bucket from compose.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "agridata-admin-token-2026"
  organization = "agridata"
  bucket = "realtime"
  [outputs.influxdb_v2.tagdrop]
    aggregated = ["true"]      # aggregates go to MongoDB only


# Output 2, MongoDB: aggregates only (permanent history, no TTL).
[[outputs.mongodb]]
  dsn = "mongodb://mongodb:27017"
  database = "farm_history"
  [outputs.mongodb.tagpass]
    aggregated = ["true"]
